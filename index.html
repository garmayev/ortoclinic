<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <!-- Для Telegram -->
    <script src="/public/js/telegram-web-app.js"></script>
    <!-- Для Max -->
    <script src="https://st.max.ru/js/max-web-app.js"></script>
    <title>Medix</title>
    
    <script>
        // Глобальное хранилище для данных мессенджера
        window.__MESSENGER_DATA__ = {
            ready: false,
            type: null,
            webApp: null,
            user: null,
            initData: null,
            initDataUnsafe: null,
            error: null,
            requestContact: null,
        };
        
        window.__MESSENGER_CALLBACKS__ = window.__MESSENGER_CALLBACKS__ || [];
        window.__MESSENGER_INITIALIZED__ = false;
        
        function triggerCallbacks() {
            console.log('[Bridge] Triggering callbacks, count:', window.__MESSENGER_CALLBACKS__.length);
            const callbacks = [...window.__MESSENGER_CALLBACKS__];
            window.__MESSENGER_CALLBACKS__ = [];
            callbacks.forEach(callback => {
                try {
                    callback();
                } catch (e) {
                    console.error('[Bridge] Callback error:', e);
                }
            });
        }
        
        window.MessengerBridge = {
            initialized: false,
            type: null,
            
            setData: function(type, webApp, user = null) {
                console.log(`[Bridge] Setting data for ${type}`, { webApp: !!webApp, user: user || webApp?.initDataUnsafe?.user });
                
                window.__MESSENGER_DATA__ = {
                    ready: true,
                    type: type,
                    webApp: webApp,
                    user: user || webApp?.initDataUnsafe?.user || null,
                    initData: webApp?.initData || null,
                    initDataUnsafe: webApp?.initDataUnsafe || null,
                    error: null
                };
                
                window.__MESSENGER_INITIALIZED__ = true;
                
                console.log('[Bridge] Data set:', JSON.stringify(window.__MESSENGER_DATA__, null, 2));
                
                window.dispatchEvent(new CustomEvent(`${type}:ready`, { detail: window.__MESSENGER_DATA__ }));
                window.dispatchEvent(new CustomEvent('messenger:ready', { detail: window.__MESSENGER_DATA__ }));
                
                // Вызываем колбэки после установки данных
                triggerCallbacks();
                
                this.initialized = true;
                this.type = type;
            },
            
            setError: function(type, error) {
                console.log(`[Bridge] Setting error for ${type}:`, error);
                
                window.__MESSENGER_DATA__ = {
                    ready: false,
                    type: type,
                    webApp: null,
                    user: null,
                    initData: null,
                    initDataUnsafe: null,
                    error: error
                };
                
                window.dispatchEvent(new CustomEvent(`${type}:error`, { detail: { error: error } }));
                triggerCallbacks();
            },
            
            initMax: function() {
                console.log('[Bridge] Initializing Max...');
                console.log('[Bridge] Checking window objects:', {
                    hasWindowMax: !!window.Max,
                    hasWindowWebApp: !!window.WebApp,
                    hasWindowMaxWebApp: !!window.MaxWebApp,
                    windowKeys: Object.keys(window).filter(k => k.toLowerCase().includes('max'))
                });
                
                // Проверяем наличие Max WebApp в разных местах
                let checkCount = 0;
                const maxAttempts = 50;
                
                const checkMax = setInterval(() => {
                    checkCount++;
                    
                    // Проверяем различные варианты расположения Max API
                    let webApp = null;
                    let source = '';
                    
                    if (window.Max?.WebApp) {
                        webApp = window.Max.WebApp;
                        source = 'window.Max.WebApp';
                        console.log(`[Bridge] Attempt ${checkCount}: Found ${source}`);
                    } else if (window.WebApp) {
                        webApp = window.WebApp;
                        source = 'window.WebApp';
                        console.log(`[Bridge] Attempt ${checkCount}: Found ${source}`);
                    } else if (window.MaxWebApp) {
                        webApp = window.MaxWebApp;
                        source = 'window.MaxWebApp';
                        console.log(`[Bridge] Attempt ${checkCount}: Found ${source}`);
                    }
                    
                    if (webApp) {
                        console.log(`[Bridge] WebApp object from ${source}:`, {
                            hasReady: !!webApp.ready,
                            hasExpand: !!webApp.expand,
                            hasInitData: !!webApp.initData,
                            hasInitDataUnsafe: !!webApp.initDataUnsafe,
                            initDataUnsafe: webApp.initDataUnsafe,
                            initData: webApp.initData
                        });
                        
                        if (webApp.initDataUnsafe || webApp.initData) {
                            clearInterval(checkMax);
                            console.log('[Bridge] Max WebApp fully initialized on attempt', checkCount);
                            
                            try {
                                if (webApp.ready) {
                                    console.log('[Bridge] Calling webApp.ready()');
                                    webApp.ready();
                                }
                                if (webApp.expand) {
                                    console.log('[Bridge] Calling webApp.expand()');
                                    webApp.expand();
                                }
                            } catch (e) {
                                console.error('[Bridge] Error calling Max methods:', e);
                            }
                            
                            this.setData('max', webApp);
                            return;
                        } else {
                            console.log(`[Bridge] WebApp found but not fully initialized yet (no initData/initDataUnsafe)`);
                        }
                    }
                    
                    if (checkCount >= maxAttempts) {
                        clearInterval(checkMax);
                        console.warn('[Bridge] Max WebApp not found after', maxAttempts, 'attempts');
                        this.setData('none', null);
                    }
                }, 100);
            },
            
            initTelegram: function() {
                console.log('[Bridge] Initializing Telegram...');
                
                let checkCount = 0;
                const maxAttempts = 30;
                
                const checkTelegram = setInterval(() => {
                    checkCount++;
                    
                    if (window.Telegram?.WebApp) {
                        clearInterval(checkTelegram);
                        console.log('[Bridge] Telegram WebApp found on attempt', checkCount);
                        
                        const webApp = window.Telegram.WebApp;
                        
                        try {
                            if (webApp.ready) webApp.ready();
                            if (webApp.expand) webApp.expand();
                        } catch (e) {
                            console.error('[Bridge] Error calling Telegram methods:', e);
                        }
                        
                        this.setData('telegram', window.Telegram?.WebApp);
                    } else if (checkCount >= maxAttempts) {
                        clearInterval(checkTelegram);
                        console.warn('[Bridge] Telegram WebApp not found after', maxAttempts, 'attempts');
                        
                        if (this.type !== 'max') {
                            this.setData('none', null);
                        }
                    }
                }, 100);
            },
            
            detectAndInit: function() {
                // Проверяем URL параметры
                const urlParams = new URLSearchParams(window.location.search);
                const isMaxParam = urlParams.get('platform') === 'max';
                const isTelegramParam = urlParams.get('platform') === 'telegram';
                
                // Проверяем user agent
                const ua = navigator.userAgent;
                const isMaxUA = !!window.WebApp?.platform || ua.includes('MaxMessenger');
                const isTelegramUA = !!window.Telegram || ua.includes('TelegramMessenger');

                const isMax = isMaxParam || isMaxUA;
                const isTelegram = isTelegramParam || isTelegramUA;

                console.log(isMax)
                console.log(isTelegram)
                console.log('[Bridge] Environment detected:', {
                    isMax, 
                    isTelegram, 
                    isMaxParam, 
                    isMaxUA, 
                    isTelegramParam,
                    isTelegramUA,
                    ua
                });
                
                if (isMax) {
                    this.initMax();
                } else if (isTelegram) {
                    this.initTelegram();
                } else {
                    console.log('[Bridge] No messenger environment');
                    this.setData('none', null);
                }
            }
        };
        document.addEventListener("DOMContentLoaded", () => {
            // Запускаем определение окружения после загрузки страницы
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', () => {
                    console.log('[Bridge] DOMContentLoaded, starting detection');
                    window.MessengerBridge.detectAndInit();
                });
            } else {
                console.log('[Bridge] Document already loaded, starting detection');
                window.MessengerBridge.detectAndInit();
            }
            
            // Также проверяем сразу, если скрипты уже загружены
            setTimeout(() => {
                if (!window.__MESSENGER_INITIALIZED__) {
                    console.log('[Bridge] Fallback check after timeout');
                    window.MessengerBridge.detectAndInit();
                }
            }, 500);
        })
    </script>
    <script type="module" src="/app/main.tsx"></script>
</head>
<body>
    <div id="root"></div>
</body>
</html>
